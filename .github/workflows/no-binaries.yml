name: Block Binary Files in PRs

on:
  pull_request:
    branches: [ "main", "master" ]  # укажи свою основную ветку

jobs:
  check-for-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # чтобы можно было сравнивать с базовой веткой

      - name: Detect forbidden binary files
        run: |
          # Получаем список файлов, изменённых в PR
          BASE_REF="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="origin/main"
          fi

          # Сравниваем с основной веткой
          changed_files=$(git diff --name-only --diff-filter=A $BASE_REF...HEAD)

          # Если diff-filter=A дал пусто (например, изменения в существующих файлах), берём все изменения
          if [ -z "$changed_files" ]; then
            changed_files=$(git diff --name-only $BASE_REF...HEAD)
          fi

          if [ -z "$changed_files" ]; then
            echo "No files changed."
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          # Запрещённые расширения
          forbidden=(
            ".exe" ".dll" ".so" ".dylib" ".lib" ".a" ".obj" ".o"
            ".bin" ".dat" ".blob" ".pdb" ".ilk" ".exp"
            ".zip" ".tar" ".gz" ".7z" ".rar"
            ".msi" ".dmg" ".pkg"
          )

          found=0
          while IFS= read -r file; do
            for ext in "${forbidden[@]}"; do
              if [[ "$file" == *"$ext" ]]; then
                echo "❌ FORBIDDEN BINARY FILE: $file"
                found=1
              fi
            done
          done <<< "$changed_files"

          if [ $found -eq 1 ]; then
            echo ""
            echo "Binary files are not allowed in this repository."
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi
